services:
  postgres:
    image: postgres:16-alpine
    container_name: mailbox-postgres
    environment:
      POSTGRES_USER: mailbox
      POSTGRES_PASSWORD: mailbox
      POSTGRES_DB: mailbox_orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbox -d mailbox_orders"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
